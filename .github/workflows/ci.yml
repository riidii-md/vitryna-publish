name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify source, modes, artifacts, and publisher logic
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          test -z "$(gofmt -l cmd config export internal test)"
          go test -race ./...
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/vitryna" ./cmd/vitryna
          "$RUNNER_TEMP/vitryna" version
          "$RUNNER_TEMP/vitryna" help
      - name: Validate generated workflow variants
        shell: bash
        run: |
          set -euo pipefail
          workflow_fixtures="$(mktemp -d "$RUNNER_TEMP/vitryna-workflows.XXXXXX")"
          VITRYNA_WORKFLOW_FIXTURE_DIR="$workflow_fixtures" go test ./internal/scaffold -run TestWorkflowMissingVerificationFailsAndVariantFixtures -count=1
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= \
            "$workflow_fixtures/manual.yml" "$workflow_fixtures/rulesets.yml" "$workflow_fixtures/classic.yml" \
            .github/workflows/ci.yml .github/workflows/release.yml
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build repeatable platform assets without publishing
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/vitryna-release --version v0.1.0-ci --output "$RUNNER_TEMP/vitryna-release-a"
          go run ./cmd/vitryna-release --version v0.1.0-ci --output "$RUNNER_TEMP/vitryna-release-b"
          diff "$RUNNER_TEMP/vitryna-release-a/checksums.txt" "$RUNNER_TEMP/vitryna-release-b/checksums.txt"
          (cd "$RUNNER_TEMP/vitryna-release-a" && sha256sum --check checksums.txt)
          "$RUNNER_TEMP/vitryna-release-a/vitryna-linux-amd64" version
          test "$(find "$RUNNER_TEMP/vitryna-release-a" -maxdepth 1 -type f | wc -l)" -eq 6
